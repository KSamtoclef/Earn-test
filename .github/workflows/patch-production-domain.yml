name: Patch production domain metadata
on:
  push:
    paths:
      - scripts/patch-production-domain.mjs
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/patch-production-domain.mjs
      - run: node --check assets/js/app.js
      - name: Commit domain metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Set canonical production domain metadata"
          git push
