name: Final runtime cleanup
on:
  push:
    paths:
      - scripts/final-runtime-cleanup.mjs
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/final-runtime-cleanup.mjs
      - name: Remove one-time migration files
        run: git rm scripts/final-runtime-cleanup.mjs .github/workflows/final-runtime-cleanup.yml
      - run: npm run validate
      - run: npm run build
      - name: Commit normalized runtime source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js assets/js/features/level-journey.js scripts/validate-production.mjs
          git diff --cached --quiet || git commit -m "Finish runtime ownership and repository validation"
          git push
