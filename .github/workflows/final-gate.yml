name: Final release gate
on:
  push:
    paths:
      - .github/workflows/final-gate.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Validate and build
        shell: bash
        run: |
          set +e
          npm run validate > validation-output.txt 2>&1
          V=$?
          npm run build > build-output.txt 2>&1
          B=$?
          {
            echo '# Earn Chat final gate'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Validation exit: $V"
            echo "Build exit: $B"
            echo
            echo '## Validation'
            echo '```text'
            cat validation-output.txt
            echo '```'
            echo
            echo '## Build'
            echo '```text'
            cat build-output.txt
            echo '```'
          } > FINAL_GATE.md
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FINAL_GATE.md
          git commit -m "Record final release gate" || exit 0
          git push
