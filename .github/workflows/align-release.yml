name: Align production release
on:
  push:
    paths:
      - scripts/align-release.mjs
      - .github/workflows/align-release.yml
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/align-release.mjs
      - name: Commit aligned release
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Align first-paint release with consolidated source"
          git push origin HEAD:main
