name: Add business configuration section
on:
  push:
    paths:
      - scripts/add-business-config-section.mjs
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/add-business-config-section.mjs
      - run: node --check assets/js/admin/configuration.js
      - run: node --check assets/js/app.js
      - name: Commit business configuration integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/admin/configuration.js assets/js/app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Expose core monetary settings in Admin configuration"
          git push
