name: Finalize customer configuration
on:
  push:
    paths:
      - scripts/finalize-customer-config.mjs
      - scripts/finalize-api-config.mjs
      - scripts/finalize-customer-config-cleanup.mjs
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/finalize-api-config.mjs
      - run: node scripts/finalize-customer-config.mjs
      - run: node scripts/finalize-customer-config-cleanup.mjs
      - run: node --check assets/js/api.js
      - run: node --check assets/js/app.js
      - name: Commit aligned runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/api.js assets/js/app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete customer configuration and task restart alignment"
          git push
