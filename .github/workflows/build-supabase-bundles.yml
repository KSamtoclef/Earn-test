name: Build Supabase bundles
on:
  push:
    paths:
      - scripts/build-supabase-bundles.mjs
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-supabase-bundles.mjs
      - name: Commit SQL bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/EARNCHAT_RUN_1_APPLY_ALL_20260801.sql supabase/EARNCHAT_RUN_2_VERIFY_ALL_20260801.sql
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add two-step Supabase production bundles"
          git push
