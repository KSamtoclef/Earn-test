name: Remove redundant Admin Analytics navigation
on:
  push:
    paths:
      - scripts/run-remove-admin-analytics-20260809.txt
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/remove-admin-analytics-20260809.mjs
      - name: Syntax checks
        run: find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Production tests
        run: npm test
      - name: Commit update and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/admin/core.js assets/js/admin/admin-experience.js scripts/validate-admin-experience.mjs
          git rm scripts/remove-admin-analytics-20260809.mjs scripts/run-remove-admin-analytics-20260809.txt .github/workflows/remove-admin-analytics-20260809.yml
          git commit -m "Remove redundant Admin Analytics navigation"
          git push
