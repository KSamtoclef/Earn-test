name: Diagnose guided chat countdown
on:
  push:
    paths:
      - scripts/run-chat-countdown-diagnostic.txt
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run diagnostic
        shell: bash
        run: |
          set +e
          node scripts/fix-chat-countdown.mjs > chat-countdown-diagnostic.log 2>&1
          echo "patch_exit=$?" >> chat-countdown-diagnostic.log
          node --check assets/js/app.js >> chat-countdown-diagnostic.log 2>&1
          echo "syntax_exit=$?" >> chat-countdown-diagnostic.log
          npm test >> chat-countdown-diagnostic.log 2>&1
          echo "test_exit=$?" >> chat-countdown-diagnostic.log
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat-countdown-diagnostic.log
          git commit -m "Capture guided chat countdown diagnostic"
          git push
