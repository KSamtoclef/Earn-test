name: Patch validator names
on:
  push:
    paths:
      - scripts/patch-validator-names.mjs
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-validator-names.mjs
      - run: node --check scripts/validate-production.mjs
      - name: Commit corrected validator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-production.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Correct final validator function and lifecycle names"
          git push
