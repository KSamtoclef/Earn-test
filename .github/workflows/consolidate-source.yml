name: Consolidate application source
on:
  push:
    paths:
      - scripts/consolidate-source.mjs
      - .github/workflows/consolidate-source.yml
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/consolidate-source.mjs
      - run: node scripts/validate-production.mjs
      - name: Commit normalized source
        run: |
          if git diff --quiet; then
            echo "Source already consolidated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js
          git commit -m "Consolidate authoritative application source"
          git push origin HEAD:main
