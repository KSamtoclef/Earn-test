name: Release stability r2
on:
  push:
    paths:
      - scripts/release-stability-r2.mjs
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/release-stability-r2.mjs
      - run: node --check assets/js/app.js
      - run: node --check assets/js/supabase-client.js
      - run: npm run validate
      - run: node scripts/build-static.mjs
      - name: Commit stability release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/app.js assets/js/supabase-client.js
          git commit -m "Publish stability r2 with cache-safe assets"
          git push
