name: Consolidate Admin source
on:
  push:
    paths:
      - scripts/consolidate-admin-source.mjs
      - .github/workflows/consolidate-admin-source.yml
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/consolidate-admin-source.mjs
      - name: Commit Admin consolidation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/admin/core.js
          git commit -m "Consolidate Admin loading and draft lifecycle"
          git push origin HEAD:main
