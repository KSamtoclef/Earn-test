name: Fix KYC runtime wiring
on:
  push:
    paths:
      - scripts/fix-kyc-runtime.mjs
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-kyc-runtime.mjs
      - run: node --check assets/js/app.js
      - run: npm test
      - name: Commit KYC runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Connect customer KYC to authoritative Admin settings"
          git push
