name: Finalize production validator
on:
  push:
    paths:
      - scripts/finalize-validator.mjs
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/finalize-validator.mjs
      - run: node --check scripts/validate-production.mjs
      - run: npm run validate
      - name: Commit validator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-production.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align production validation with final configuration contracts"
          git push
