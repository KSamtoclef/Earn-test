name: Final stability and performance
on:
  push:
    paths:
      - scripts/final-stability-performance.mjs
      - .github/workflows/final-stability-performance.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run migration and capture result
        run: |
          set +e
          node scripts/final-stability-performance.mjs > FINAL_STABILITY_REPORT.txt 2>&1
          echo "migration_exit=$?" >> FINAL_STABILITY_REPORT.txt
          exit 0
      - name: Commit migration report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FINAL_STABILITY_REPORT.txt
          git commit -m "Record final stability migration result"
          git push
