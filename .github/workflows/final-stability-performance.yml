name: Final stability and performance
on:
  push:
    paths:
      - scripts/final-stability-performance.mjs
      - .github/workflows/final-stability-performance.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare one-time migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/final-stability-performance.mjs')
          s=p.read_text()
          old="window.addEventListener('pagehide',()=>api.presenceInactive(presenceSession).catch(()=>{})}"
          new="window.addEventListener('pagehide',()=>api.presenceInactive(presenceSession).catch(()=>{}))}"
          if old not in s:
              raise SystemExit('Expected migration matcher was not found')
          p.write_text(s.replace(old,new,1))
          PY
      - run: node scripts/final-stability-performance.mjs
      - name: Correct generated pagehide listener
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/js/app.js')
          s=p.read_text()
          old="window.addEventListener('pagehide',()=>api.presenceInactive(presenceSession).catch(()=>{})}"
          new="window.addEventListener('pagehide',()=>api.presenceInactive(presenceSession).catch(()=>{}))}"
          if old not in s:
              raise SystemExit('Generated pagehide listener was not found')
          p.write_text(s.replace(old,new,1))
          PY
      - run: node --check assets/js/api.js
      - run: node --check assets/js/admin/configuration.js
      - run: node --check assets/js/admin/core.js
      - run: node --check assets/js/app.js
      - run: npm run validate
      - run: node scripts/build-static.mjs
      - name: Commit final stability changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/api.js assets/js/admin/configuration.js assets/js/admin/core.js assets/js/app.js assets/css/app.css
          git commit -m "Stabilize Admin rendering and remove remaining startup blockers"
          git push
