name: Final stability and performance
on:
  push:
    paths:
      - scripts/final-stability-performance.mjs
      - .github/workflows/final-stability-performance.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full diagnostic
        run: |
          set +e
          : > FINAL_STABILITY_REPORT.txt
          python - <<'PY' >> FINAL_STABILITY_REPORT.txt 2>&1
          from pathlib import Path
          p=Path('scripts/final-stability-performance.mjs')
          s=p.read_text()
          old="window.addEventListener('pagehide',()=>api.presenceInactive(presenceSession).catch(()=>{})}"
          new="window.addEventListener('pagehide',()=>api.presenceInactive(presenceSession).catch(()=>{}))}"
          if old not in s:
              raise SystemExit('Expected migration matcher was not found')
          p.write_text(s.replace(old,new,1))
          PY
          echo "matcher_exit=$?" >> FINAL_STABILITY_REPORT.txt
          node scripts/final-stability-performance.mjs >> FINAL_STABILITY_REPORT.txt 2>&1
          echo "migration_exit=$?" >> FINAL_STABILITY_REPORT.txt
          node --check assets/js/api.js >> FINAL_STABILITY_REPORT.txt 2>&1; echo "api_check=$?" >> FINAL_STABILITY_REPORT.txt
          node --check assets/js/admin/configuration.js >> FINAL_STABILITY_REPORT.txt 2>&1; echo "config_check=$?" >> FINAL_STABILITY_REPORT.txt
          node --check assets/js/admin/core.js >> FINAL_STABILITY_REPORT.txt 2>&1; echo "core_check=$?" >> FINAL_STABILITY_REPORT.txt
          node --check assets/js/app.js >> FINAL_STABILITY_REPORT.txt 2>&1; echo "app_check=$?" >> FINAL_STABILITY_REPORT.txt
          npm run validate >> FINAL_STABILITY_REPORT.txt 2>&1; echo "validate_exit=$?" >> FINAL_STABILITY_REPORT.txt
          node scripts/build-static.mjs >> FINAL_STABILITY_REPORT.txt 2>&1; echo "build_exit=$?" >> FINAL_STABILITY_REPORT.txt
          exit 0
      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FINAL_STABILITY_REPORT.txt
          git commit -m "Record full final stability diagnostic"
          git push
