name: Final clean production gate
on:
  push:
    paths:
      - .github/workflows/final-clean-gate.yml
      - scripts/validate-deployment.mjs
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run final clean gate
        run: |
          set +e
          : > FINAL_CLEAN_GATE.txt
          node --check assets/js/app.js >> FINAL_CLEAN_GATE.txt 2>&1; echo "app_syntax=$?" >> FINAL_CLEAN_GATE.txt
          node --check assets/js/api.js >> FINAL_CLEAN_GATE.txt 2>&1; echo "api_syntax=$?" >> FINAL_CLEAN_GATE.txt
          node --check assets/js/admin/core.js >> FINAL_CLEAN_GATE.txt 2>&1; echo "admin_core_syntax=$?" >> FINAL_CLEAN_GATE.txt
          node --check assets/js/admin/configuration.js >> FINAL_CLEAN_GATE.txt 2>&1; echo "admin_configuration_syntax=$?" >> FINAL_CLEAN_GATE.txt
          npm run validate >> FINAL_CLEAN_GATE.txt 2>&1; echo "validation=$?" >> FINAL_CLEAN_GATE.txt
          node scripts/build-static.mjs >> FINAL_CLEAN_GATE.txt 2>&1; echo "build=$?" >> FINAL_CLEAN_GATE.txt
          exit 0
      - name: Commit final clean gate result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FINAL_CLEAN_GATE.txt
          git commit -m "Record final clean production gate"
          git push
