name: Straighten Admin runtime
on:
  push:
    paths:
      - scripts/straighten-admin-runtime.mjs
permissions:
  contents: write
jobs:
  straighten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/straighten-admin-runtime.mjs
      - run: node --check assets/js/app.js
      - run: node --check assets/js/api.js
      - run: node --check assets/js/features/task-status.js
      - run: node --check assets/js/features/qualification.js
      - run: npm test
      - name: Commit unified runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js assets/js/api.js assets/js/features/task-status.js assets/js/features/qualification.js index.html scripts/build-static.mjs supabase/PRODUCTION_RUN_ORDER.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Unify Admin settings with customer runtime"
          git push
