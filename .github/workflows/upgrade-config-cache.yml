name: Upgrade configuration cache
on:
  push:
    paths:
      - scripts/upgrade-config-cache.mjs
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/upgrade-config-cache.mjs
      - run: node --check assets/js/api.js
      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/api.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire configuration cache invalidation and propagation"
          git push
