name: Final production check
on:
  push:
    paths:
      - .github/workflows/final-production-check.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Run validation and build
        shell: bash
        run: |
          set +e
          npm run validate > validation-output.txt 2>&1
          VALIDATE_EXIT=$?
          npm run build > build-output.txt 2>&1
          BUILD_EXIT=$?
          {
            echo "# Earn Chat final production check"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Validation exit: $VALIDATE_EXIT"
            echo "Build exit: $BUILD_EXIT"
            echo
            echo "## Validation output"
            echo '```text'
            cat validation-output.txt
            echo '```'
            echo
            echo "## Build output"
            echo '```text'
            cat build-output.txt
            echo '```'
          } > FINAL_PRODUCTION_CHECK.md
      - name: Commit verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FINAL_PRODUCTION_CHECK.md
          git commit -m "Record final production validation and build" || exit 0
          git push
