name: Fix guided chat countdown
on:
  push:
    paths:
      - scripts/fix-chat-countdown.mjs
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-chat-countdown.mjs
      - run: node --check assets/js/app.js
      - run: npm test
      - name: Commit countdown repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js
          git commit -m "Repair guided chat countdown and Safari resync"
          git push
