name: Cleanup API source
on:
  push:
    paths:
      - scripts/cleanup-api-source.mjs
      - .github/workflows/cleanup-api-source.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/cleanup-api-source.mjs
      - name: Commit API cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/api.js
          git commit -m "Remove duplicate auth subscription and public stats API"
          git push origin HEAD:main
