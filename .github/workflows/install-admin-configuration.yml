name: Install Admin configuration
on:
  push:
    paths:
      - scripts/install-admin-configuration.mjs
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/install-admin-configuration.mjs
      - run: node --check assets/js/api.js
      - run: node --check assets/js/admin/core.js
      - run: node --check assets/js/admin/configuration.js
      - name: Commit integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/api.js assets/js/admin/core.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate authoritative Admin configuration control center"
          git push
