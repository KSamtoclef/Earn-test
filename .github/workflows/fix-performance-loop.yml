name: Fix performance loop
on:
  push:
    paths:
      - scripts/fix-performance-loop.mjs
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-performance-loop.mjs
      - run: node --check assets/js/api.js
      - run: node --check assets/js/admin/configuration.js
      - run: node --check assets/js/app.js
      - run: npm run validate
      - run: node scripts/build-static.mjs
      - name: Commit performance fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/api.js assets/js/admin/configuration.js assets/js/app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Eliminate configuration reload loop and accelerate startup"
          git push
