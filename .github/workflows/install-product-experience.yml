name: Install product experience
on:
  push:
    paths:
      - scripts/run-product-experience.txt
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/install-product-experience.mjs
      - run: node --check assets/js/app.js
      - run: node --check assets/js/product-experience.js
      - run: npm test
      - name: Commit production experience
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/app.js package.json scripts/validate-final-completion.mjs
          git commit -m "Upgrade homepage and member experience"
          git push
